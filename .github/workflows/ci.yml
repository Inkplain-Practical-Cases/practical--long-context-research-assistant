name: Python seven-branch test matrix
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ["main", "step-01-research-intake", "step-02-bounded-context-window-and-token-budgeti", "step-03-retrieve-evidence-with-stable-citations", "step-04-store-scoped-multi-turn-research-history", "step-05-generate-extractive-cited-research-answe", "step-06-orchestrate-bounded-multi-document-resea"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
