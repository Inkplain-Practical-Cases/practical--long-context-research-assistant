# Verify each learning branch independently on GitHub-hosted Python.
name: Verify research intake
on:
  push:
    branches:
      - "step-*"
      - main
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
